        #pessoa {
            width: 50px;

</head>
<body>

    <div id="pessoa">bug_elseif 🐍</div>

    <script>

        const elemento = document.querySelectorAll('#pessoa')
        console.log(elemento.textContent)


        elemento.forEach(ele => {
        console.log(elemento.textContent)

        // Calcula posições aleatórias
        const larguraJanela = window.innerWidth;
        const alturaJanela = window.innerHeight;
    
        // Gera coordenadas aleatórias dentro dos limites da janela
        const posicaoAleatoriaX = Math.random() * (larguraJanela - 50); // Subtraindo 50 para manter o elemento visível
        const posicaoAleatoriaY = Math.random() * (alturaJanela - 50);
    
        // Define a posição do elemento
        elemento.style.left = `${posicaoAleatoriaX}px`;
        elemento.style.top = `${posicaoAleatoriaY}px`;
    });

    </script>
